<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0b1220"/>
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="url(#g)" opacity="0.15"/>
  <g transform="translate(80,120)">
    <text x="0" y="0" fill="#e2e8f0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="64" font-weight="700">
      Swift Payment Tracker
    </text>
    <text x="0" y="80" fill="#94a3b8" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="28">
      Track and share transfer statuses across methods and networks
    </text>
  </g>
  <g transform="translate(80,260)">
    <rect x="0" y="0" width="1040" height="260" rx="16" fill="#0f172a" stroke="#1e293b"/>
    <g transform="translate(24,24)">
      <circle cx="20" cy="20" r="6" fill="#22c55e"/>
      <text x="44" y="26" fill="#cbd5e1" font-size="24" font-family="Segoe UI, Roboto, Arial, sans-serif">Transfer #PUBLIC-ID</text>
      <text x="44" y="60" fill="#94a3b8" font-size="20" font-family="Segoe UI, Roboto, Arial, sans-serif">Status: In Progress</text>
      <text x="44" y="96" fill="#94a3b8" font-size="20" font-family="Segoe UI, Roboto, Arial, sans-serif">Method: Bank / Crypto</text>
      <text x="44" y="132" fill="#94a3b8" font-size="20" font-family="Segoe UI, Roboto, Arial, sans-serif">Updated: YYYY-MM-DD</text>
    </g>
  </g>
</svg>
